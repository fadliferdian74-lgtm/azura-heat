<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AZURA HEAT — Port Azura</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a120c; font-family: 'Segoe UI', system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .minimap { position: absolute; top: 14px; left: 14px; border: 2px solid rgba(0,0,0,0.55); border-radius: 8px; box-shadow: 0 2px 14px rgba(0,0,0,0.5); }
  .cash { position: absolute; top: 212px; left: 16px; color: #7be495; font-weight: 700; font-size: 22px; text-shadow: 0 2px 4px #000; }
  .stars { position: absolute; top: 12px; right: 18px; font-size: 30px; letter-spacing: 3px; text-shadow: 0 2px 5px #000; }
  .healthwrap { position: absolute; left: 16px; bottom: 18px; width: 210px; height: 14px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.35); border-radius: 7px; overflow: hidden; }
  .healthbar { height: 100%; width: 100%; background: #53d769; transition: width 0.2s; }
  .speed { position: absolute; right: 20px; bottom: 16px; color: #fff; font-size: 26px; font-weight: 700; text-shadow: 0 2px 4px #000; }
  .noswrap { position: absolute; right: 20px; bottom: 52px; width: 130px; height: 8px; background: rgba(0,0,0,0.55); border-radius: 4px; overflow: hidden; opacity: 0; }
  .nosbar { height: 100%; width: 100%; background: #54c8ff; }
  .objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); max-width: 56%; color: #ffe9b0; background: rgba(10,10,16,0.55); padding: 7px 16px; border-radius: 16px; font-size: 16px; font-weight: 600; text-align: center; text-shadow: 0 1px 3px #000; transition: opacity 0.3s; }
  .timer { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); color: #ff9d5c; font-size: 20px; font-weight: 700; text-shadow: 0 2px 4px #000; }
  .radio { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); color: #aee6ff; font-size: 19px; font-style: italic; text-shadow: 0 2px 4px #000; opacity: 0; transition: opacity 0.4s; }
  .prompt { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); color: #fff; background: rgba(10,10,16,0.6); padding: 6px 14px; border-radius: 12px; font-size: 16px; opacity: 0; transition: opacity 0.2s; }
  .dialogue { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); width: min(620px, 80%); background: rgba(8,10,18,0.82); border-left: 4px solid #ffb36b; border-radius: 6px; padding: 10px 16px; color: #f2ede4; }
  .dlg-name { color: #ffb36b; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
  .dlg-text { font-size: 16px; margin-top: 2px; }
  .banner { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); color: #ffd23e; font-size: 44px; font-weight: 800; letter-spacing: 2px; text-shadow: 0 3px 10px #000; opacity: 0; transition: opacity 0.4s; text-align: center; white-space: nowrap; }
  .subbanner { position: absolute; top: calc(30% + 58px); left: 50%; transform: translateX(-50%); color: #fff; font-size: 19px; text-shadow: 0 2px 5px #000; opacity: 0; transition: opacity 0.4s; }
  .overlay { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, rgba(30,12,4,0.45), rgba(8,8,16,0.78)); color: #f5efe2; text-align: center; padding: 20px; }
  .overlay.show { display: flex; }
  .game-title { font-size: 74px; margin: 0; letter-spacing: 6px; font-weight: 900; color: #ffb36b; text-shadow: 0 0 26px rgba(255,140,40,0.75), 0 4px 0 #7a2c12; }
  .end-title { font-size: 64px; margin: 0; letter-spacing: 5px; font-weight: 900; color: #e2543e; text-shadow: 0 3px 12px #000; }
  .blurb { max-width: 640px; font-size: 17px; line-height: 1.5; color: #f0e6d2; }
  .controls { font-size: 14px; color: #cfc4ae; line-height: 1.7; margin: 10px 0 18px; }
  .btnrow { display: flex; gap: 14px; }
  .menubtn { pointer-events: auto; cursor: pointer; background: #e2543e; color: #fff; border: none; border-radius: 8px; padding: 13px 30px; font-size: 17px; font-weight: 700; letter-spacing: 1px; box-shadow: 0 4px 14px rgba(0,0,0,0.45); margin: 6px; }
  .menubtn:hover { background: #ff6a52; }
  .pause h2 { font-size: 40px; letter-spacing: 4px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="AZURA HEAT: 3D open-world driving and action game set in Port Azura"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
